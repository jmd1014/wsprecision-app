# 테스트 CI — push·PR 마다 전체 pytest (mock DB, secrets 불필요)
# main 푸시 = Streamlit Cloud 자동 배포라서, 여기서 실패하면 배포된 코드가 깨진 것이다.
# 로컬 게이트(전체 테스트 통과 시에만 push)는 그대로 유지하고, 이 워크플로는 2차 확인이다.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Dummy secrets (tests use a mock DB; the app only needs the keys to exist)
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml <<'EOF'
          [supabase]
          url = "https://ci.invalid"
          anon_key = "ci"
          service_role_key = "ci"
          [auth]
          disabled = true
          EOF
      - name: pytest
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests -q -p no:cacheprovider
