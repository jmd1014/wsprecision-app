# 테스트 CI — push·PR 마다 전체 pytest (mock DB, secrets 불필요)
# main 푸시 = Streamlit Cloud 자동 배포라서, 여기서 실패하면 배포된 코드가 깨진 것이다.
# 로컬 게이트(전체 테스트 통과 시에만 push)는 그대로 유지하고, 이 워크플로는 2차 확인이다.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-github-actions-annotate-failures
      - name: Dummy secrets (tests use a mock DB; the app only needs the keys to exist)
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml <<'EOF'
          [supabase]
          url = "https://ci.invalid"
          anon_key = "ci"
          service_role_key = "ci"
          [auth]
          disabled = true
          EOF
      - name: pytest
        env:
          PYTHONIOENCODING: utf-8
        shell: bash
        # 결과 요약을 run 요약 페이지(GITHUB_STEP_SUMMARY)에 남긴다 — 로그는 로그인해야 보이지만 요약은 공개
        run: |
          set -o pipefail
          python -m pytest tests -q -rf -p no:cacheprovider 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          {
            echo "### pytest (exit $status)"
            echo
            echo '```'
            grep -E "^(FAILED|ERROR) " pytest.log | head -40
            tail -5 pytest.log
            echo '```'
            echo
            echo "<details><summary>실패 상세 (마지막 150줄)</summary>"
            echo
            echo '```'
            tail -150 pytest.log
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          # 요약·로그는 GitHub 로그인해야 보여서, 실패 테스트 이름을 annotation(공개)으로도 올린다 (최대 10개)
          grep -E "^(FAILED|ERROR) " pytest.log | head -10 | while IFS= read -r line; do echo "::error title=pytest::${line}"; done
          echo "::notice title=pytest::$(tail -1 pytest.log)"
          exit $status
